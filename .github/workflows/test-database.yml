name: Database Stack Test

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'

# The kind leg of this test depends on having kind installed in the runner
# environment. It turns out that kind is pre-installed in the ubuntu-latest. It
# may be worthwhile checking which version is installed in the event that
# unexplained test failures occur.
#
# The same test also runs against a real cluster, but on a schedule rather than
# per-PR, because that costs a VM: see test-deploy-k3s.yml.
#
# The compose leg is worth its runtime for more than docker volume coverage: it
# is the one target that does not restart a failed container, so a service that
# only ever comes up because something restarted it fails here and passes on
# k8s. That is exactly how the test client's wait-for-database loop was found to
# have never retried.

jobs:
  test:
    name: "Run database test (${{ matrix.target }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [compose, kind]
    env:
      STACK_TEST_TARGET: ${{ matrix.target }}
    steps:
      - name: "Clone project repository"
        uses: actions/checkout@v5
      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
      - name: "Print kind version"
        if: matrix.target == 'kind'
        run: kind version
      - name: "Generate build version file"
        run: ./scripts/create_build_tag_file.sh
      - name: "Build local shiv package"
        run: ./scripts/build_shiv_package.sh
      - name: "Run database test"
        env:
          # "Enable debug logging" on a re-run sets runner.debug; pass it through
          # so the test script turns on xtrace and dumps its environment.
          STACK_SCRIPT_DEBUG: ${{ runner.debug }}
        run: ./tests/database/run-test.sh
