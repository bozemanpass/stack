name: Real K8S Deploy Test

# Provisions a real single-node k3s cluster on a DigitalOcean VM (via the
# "machine" utility and the machine-provisioning scripts) and runs tests against
# it: remote kubeconfig, real registry, real DNS, and HTTPS with a real Let's
# Encrypt certificate. Costs real money and real minutes, so it is not run
# per-PR.
#
# The tests in a leg share one VM -- provisioning is what costs, so adding a
# test to a leg is nearly free while adding a leg is not. Everything here also
# runs per-PR against compose and kind; this is the run that catches what only a
# real cluster has: PVCs from a storage class, images pulled from a registry,
# real ingress/gateway routing, real certificates.
#
# Sharing the VM does not mean sharing a step: the cluster's lifecycle is
# tests/k3s-deploy/cluster.sh (provision / diagnostics / destroy) and each test
# is a step of its own in between, so the job page names what ran and shows which
# test failed without anyone reading the log. The cost of that is that the
# teardown is a step rather than an exit trap, so it is `if: always()`, and every
# step that could hang has a timeout -- a job that times out would skip the
# teardown and leak the VM.

on:
  workflow_dispatch:
    inputs:
      provisioning-url:
        description: "combine.sh URL (to test a machine-provisioning branch)"
        required: false
      tests:
        description: "Which test to run; \"all\" is the per-leg set in the plan job"
        required: false
        type: choice
        default: all
        options: [all, app-deploy, database, backup, database-backup, cross-backup, volumes, kata]
      mode:
        description: "Which leg to run; each one provisions its own VM"
        required: false
        type: choice
        default: gateway
        options: [gateway, ingress, both]
  schedule:
    # Run weekly on Monday at 07:00 UTC
    - cron: "0 7 * * 1"

jobs:
  # Which legs run, and what each one runs, decided before anything is
  # provisioned. This is a separate job because each leg provisions its own VM,
  # so a dispatch that only wants one of them must not start the other -- and a
  # job-level `if` cannot do the filtering, since the matrix context is not
  # available there. Building the matrix is the only way to leave a leg out
  # rather than start it and skip its steps.
  plan:
    name: "Choose the legs to run"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      - name: "Pick the legs"
        id: legs
        env:
          MODE: ${{ inputs.mode }}
          TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          # gateway = Gateway API + traefik + per-app HTTP-01 certificates;
          # ingress = the legacy nginx ingress arrangement.
          #
          # The gateway leg carries the full suite: it is the primary path, and
          # the tests that are not about routing (the database and backup tests,
          # neither of which has an HTTP endpoint at all) only need to run once.
          # The ingress leg runs just the app deploy test, which is the one that
          # actually exercises the difference between the two arrangements.
          #
          # The backup tests only run here: K8up, which runs backups on a
          # cluster, is installed by the machine provisioning and is not present
          # on a kind cluster. There are three of them: two covering the two
          # shapes a backup can have -- files (tests/backup) and a streamed
          # logical dump (tests/database/run-backup-test.sh) -- and this is the
          # only place the dump one runs against the engine that actually takes
          # it in production. The third (cross-backup) restores each engine's
          # backup with the other one, compose deployments on the runner's own
          # Docker against K8up on the cluster, and so runs nowhere but here by
          # construction.
          #
          # The volumes test only runs here against a real cluster: its remote
          # leg is the one place the node-path volume mechanism (a `local`
          # PersistentVolume with node affinity, docs/volumes.md) runs for
          # real, and it needs the node SSH access that only the cluster
          # harness has.
          #
          # These are names rather than script paths: each one selects the test
          # step of the same name in the job below, which is what runs it.
          gateway_tests='["app-deploy","database","backup","database-backup","cross-backup","volumes","kata"]'
          ingress_tests='["app-deploy"]'
          # The `tests` dropdown names one test to run instead of the per-leg set
          # above. Only the ones that accept the remote target are offered; the
          # rest are single-target by construction (k8s-deployment-control owns
          # its own kind cluster).
          case "${TESTS}" in
            ''|all) ;;
            # kata is gateway-only, because only that leg provisions a cluster
            # with the kata runtime installed (see the job's STACK_K3S_KATA).
            # An ingress leg asking for it would provision a VM able to run
            # nothing, so it is given an empty list instead.
            kata)
              gateway_tests="[\"${TESTS}\"]"
              ingress_tests='[]'
              ;;
            app-deploy|database|backup|database-backup|cross-backup|volumes)
              gateway_tests="[\"${TESTS}\"]"
              ingress_tests="${gateway_tests}"
              ;;
            *) echo "Unknown test: ${TESTS}" >&2; exit 1 ;;
          esac
          # A dispatch defaults to the gateway leg alone, since that is the
          # primary arrangement and the second leg is a second VM. A scheduled
          # run sets no inputs at all -- defaults apply to the form, not to the
          # event -- and the empty case is what makes the weekly run cover both.
          #
          # Each leg's test list is carried as a JSON string for the steps to read
          # back with fromJSON, so that a step's condition is an exact match
          # against the list rather than a substring of it. jq builds it: hand
          # assembly of JSON that is then embedded in JSON fails in the matrix
          # expansion, where the error says nothing about why.
          matrix=$( jq -cn --arg mode "${MODE}" --argjson gw "${gateway_tests}" --argjson ing "${ingress_tests}" '
            {
              gateway: { mode: "gateway", tests: ($gw | tojson) },
              ingress: { mode: "ingress", tests: ($ing | tojson) },
            } as $legs
            | { include: (
                  if   $mode == "gateway" then [$legs.gateway]
                  elif $mode == "ingress" then [$legs.ingress]
                  else [$legs.gateway, $legs.ingress]
                  end
                ) }' )
          echo "Running: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  test:
    name: "Deploy to real k3s (${{ matrix.mode }})"
    needs: plan
    runs-on: ubuntu-24.04
    environment: k3s-test
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # At the job level because the cluster and every test step needs some of it,
    # and repeating it per step is how the two drift apart.
    env:
      STACK_K3S_MODE: ${{ matrix.mode }}
      # Kata Containers on the node, so that the kata test can put a pod in a
      # VM. It costs a larger machine and a longer provisioning run, so it is
      # installed for the legs that actually run that test rather than always:
      # a dispatch asking only for the app deploy test gets the smaller, faster
      # cluster it used to get. Nothing else in a leg is affected -- a pod that
      # names no RuntimeClass runs exactly as it did before -- which is what
      # lets the kata test share this cluster with the rest.
      STACK_K3S_KATA: ${{ contains(fromJSON(matrix.tests), 'kata') }}
      MACHINE_DO_TOKEN: ${{ secrets.K3S_TEST_DO_TOKEN }}
      MACHINE_SSH_KEY_NAME: ${{ vars.K3S_TEST_SSH_KEY_NAME }}
      MACHINE_DNS_ZONE: ${{ vars.K3S_TEST_DNS_ZONE }}
      MACHINE_PROJECT: ${{ vars.K3S_TEST_PROJECT }}
      MACHINE_PROVISIONING_URL: ${{ inputs.provisioning-url }}
      STACK_IMAGE_REGISTRY: ${{ vars.K3S_TEST_IMAGE_REGISTRY }}
      STACK_IMAGE_REGISTRY_USER: ${{ secrets.K3S_TEST_REGISTRY_TOKEN }}
      STACK_IMAGE_REGISTRY_TOKEN: ${{ secrets.K3S_TEST_REGISTRY_TOKEN }}
      LETSENCRYPT_EMAIL: ${{ vars.K3S_TEST_LETSENCRYPT_EMAIL }}
      # Where the backup test's backups go. The bucket may be given as its
      # URL; the test splits out the endpoint.
      STACK_BACKUP_S3_BUCKET: ${{ vars.K3S_TEST_BACKUP_S3_BUCKET }}
      STACK_BACKUP_S3_KEY_ID: ${{ secrets.K3S_TEST_BACKUP_S3_KEY_ID }}
      STACK_BACKUP_S3_KEY: ${{ secrets.K3S_TEST_BACKUP_S3_KEY }}
      # A fixed repository password, so that the repositories runs leave in
      # the bucket can still be read afterwards -- to restore one by hand, or
      # as the fixture for a test that restores what an earlier run backed up.
      # The test generates a per-run password when this is unset, and those
      # repositories die with the run that wrote them.
      STACK_BACKUP_RESTIC_PASSWORD: ${{ secrets.K3S_TEST_BACKUP_RESTIC_PASSWORD }}
    steps:
      - name: "Clone project repository"
        uses: actions/checkout@v5
      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
      - name: "Install the machine utility"
        run: uv tool install git+https://github.com/stirlingbridge/machine.git
      - name: "Write the SSH key"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.K3S_TEST_SSH_KEY }}" > ~/.ssh/k3s-test-key
          chmod 600 ~/.ssh/k3s-test-key
          # For every later step: the cluster script fetches the kubeconfig and
          # the diagnostics over SSH.
          echo "MACHINE_SSH_KEY_FILE=$HOME/.ssh/k3s-test-key" >> "$GITHUB_ENV"
      - name: "Turn on script debug logging if the run asked for it"
        # Ticking "Enable debug logging" on a re-run turns on xtrace and the
        # environment dump in the test scripts.  A step rather than part of the
        # job's env block, which cannot see the runner context.
        run: echo "STACK_SCRIPT_DEBUG=${{ runner.debug }}" >> "$GITHUB_ENV"
      - name: "Generate build version file"
        run: ./scripts/create_build_tag_file.sh
      - name: "Build local shiv package"
        run: ./scripts/build_shiv_package.sh

      - name: "Provision a k3s cluster on a cloud VM"
        id: provision
        # Cloud-init installs k3s, cert-manager, traefik and K8up; the script
        # gives that 30 minutes before giving up on it, or 45 when it is
        # installing kata as well -- kata-deploy unpacks its artifacts and
        # restarts k3s, on a machine whose nested virtualization is not fast.
        timeout-minutes: 55
        run: ./tests/k3s-deploy/cluster.sh provision

      # Each test below runs against that one cluster, in a namespace of its own.
      # They are guarded alike: skip if this leg did not ask for the test, skip if
      # there is no cluster, but run even if an earlier test failed -- the VM is
      # already paid for, and the run may as well report every failure it can
      # find. `fail-fast: false` says the same thing one level up, between legs.
      - name: "App deploy: HTTPS with a real certificate, and data across a restart"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && contains(fromJSON(matrix.tests), 'app-deploy') }}
        timeout-minutes: 30
        run: ./tests/app-deploy/run-test.sh
      - name: "Database: data in a PVC survives a stop and start"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && contains(fromJSON(matrix.tests), 'database') }}
        timeout-minutes: 30
        run: ./tests/database/run-test.sh
      - name: "Backup: files backed up by K8up and restored into a new deployment"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && contains(fromJSON(matrix.tests), 'backup') }}
        timeout-minutes: 30
        run: ./tests/backup/run-test.sh
      - name: "Database backup: a streamed pg_dump replayed into a new deployment"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && contains(fromJSON(matrix.tests), 'database-backup') }}
        timeout-minutes: 30
        run: ./tests/database/run-backup-test.sh
      - name: "Cross-target backup: each engine restores the other's backup"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && contains(fromJSON(matrix.tests), 'cross-backup') }}
        timeout-minutes: 30
        run: ./tests/backup/run-cross-target-test.sh
      - name: "Volumes: data at a chosen node path reaches the container"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && contains(fromJSON(matrix.tests), 'volumes') }}
        timeout-minutes: 30
        run: ./tests/volumes/run-test.sh
      - name: "Kata: a service given a runtime class runs in a VM, its neighbour does not"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && contains(fromJSON(matrix.tests), 'kata') }}
        timeout-minutes: 30
        run: ./tests/kata/run-test.sh

      - name: "Collect cluster diagnostics"
        # Only worth the SSH round trip when something above failed, and it has to
        # happen before the teardown below: the VM is the only place this state
        # exists.
        if: ${{ failure() }}
        timeout-minutes: 10
        run: ./tests/k3s-deploy/cluster.sh diagnostics
      - name: "Destroy the cluster"
        # However the job ends, including a cancellation: what is left behind
        # otherwise is a VM nobody is watching, billed by the hour.
        if: ${{ always() }}
        timeout-minutes: 15
        run: ./tests/k3s-deploy/cluster.sh destroy
