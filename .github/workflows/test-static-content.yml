name: Static Content Test

# Scheduled as well as per-PR for the same reason as the webapp test: it builds
# a separate content repo with a separately built wrapper image, so it can start
# failing without a commit here.
on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'
  schedule:
    # Run weekly on Monday at 06:30 UTC
    - cron: "30 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: "Run static content test suite"
    runs-on: ubuntu-24.04
    steps:
      - name: "Clone project repository"
        uses: actions/checkout@v5
      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
      - name: "Generate build version file"
        run: ./scripts/create_build_tag_file.sh
      - name: "Build local shiv package"
        run: ./scripts/build_shiv_package.sh
      - name: "Run static content tests"
        env:
          # "Enable debug logging" on a re-run sets runner.debug; pass it through
          # so the test script turns on xtrace and dumps its environment.
          STACK_SCRIPT_DEBUG: ${{ runner.debug }}
        run: ./tests/static-content-test/run-static-content-test.sh
