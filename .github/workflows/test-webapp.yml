name: Webapp Test

# Also run on a schedule, because this test can break with no commit in any of
# our repositories: it builds an app repo from its default branch, with a
# wrapper base image built from whatever the package registries hold that day.
# A dependency that drops the wrapper's node version, or an app repo change
# landing without this test running, shows up here and nowhere else.
on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: "Run webapp test suite"
    runs-on: ubuntu-24.04
    steps:
      - name: "Clone project repository"
        uses: actions/checkout@v5
      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
      - name: "Generate build version file"
        run: ./scripts/create_build_tag_file.sh
      - name: "Build local shiv package"
        run: ./scripts/build_shiv_package.sh
      - name: "Run webapp tests"
        env:
          # "Enable debug logging" on a re-run sets runner.debug; pass it through
          # so the test script turns on xtrace and dumps its environment.
          STACK_SCRIPT_DEBUG: ${{ runner.debug }}
        run: ./tests/webapp-test/run-webapp-test.sh
