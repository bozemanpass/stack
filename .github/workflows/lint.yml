name: Lint Checks

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'

jobs:
  test:
    name: "Run linter"
    runs-on: ubuntu-24.04
    steps:
      - name: "Clone project repository"
        uses: actions/checkout@v5
      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
      - name: "Install dependencies"
        run: uv sync
      - name: "Run flake8"
        run: uv run flake8 --config tox.ini
      - name: "Check syntax against minimum supported Python"
        # The zipapp runs on whatever python3 the target machine has, so the source
        # must parse on the oldest version we claim to support (requires-python).
        run: uv run --python 3.10 --no-project python -m compileall -q src/
