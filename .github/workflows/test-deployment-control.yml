name: K8S Deployment Control Test

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'

# This test depends on having kind installed in the runner environment. It turns
# out that kind is pre-installed in the ubuntu-latest. It may be worthwhile
# checking which version is installed in the event that unexplained test
# failures occur.
#
# Kind only, and there is no matrix to add: the test builds a four node cluster
# with labelled and tainted workers, which is something only a target whose
# cluster the test owns can provide.

jobs:
  test:
    name: "Run k8s deployment control test"
    runs-on: ubuntu-24.04
    steps:
      - name: "Clone project repository"
        uses: actions/checkout@v5
      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
      - name: "Print kind version"
        run: kind version
      - name: "Generate build version file"
        run: ./scripts/create_build_tag_file.sh
      - name: "Build local shiv package"
        run: ./scripts/build_shiv_package.sh
      - name: "Run k8s deployment control test"
        env:
          # "Enable debug logging" on a re-run sets runner.debug; pass it through
          # so the test script turns on xtrace and dumps its environment.
          STACK_SCRIPT_DEBUG: ${{ runner.debug }}
        run: ./tests/k8s-deployment-control/run-test.sh
